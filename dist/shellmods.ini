; shellmods configuration.
;
; Every value under a mod's section is one of that mod's upstream Windhawk
; settings, at upstream's own default. Windhawk renders these from the
; ==WindhawkModSettings== block at the top of each mod source; we have no UI, so
; this file is the settings screen.
;
; IMPORTANT: a key that is absent here reads as 0 (or "" for text), NOT as the
; upstream default. If you delete a line you are setting it to zero, not
; restoring it. Booleans are 1/0.
;
; Editing this file takes effect without restarting Explorer: each injected mod
; watches this directory and re-reads its settings on change. The one exception
; is calculateFolderSizes, noted where it appears.

[shellmods]
; Trace every hook the mods take, to shellmods.log and OutputDebugString.
;
; Turn this on only while diagnosing something. Every hook entry logs, and the
; taskbar mod's hooks run on essentially every paint, so this produces roughly
; a megabyte a minute. Toggling it takes effect immediately -- no restart.
;
; Independent of this setting, the shim always logs its own diagnostics: which
; symbol files loaded, and -- the one that matters -- whether a symbol file has
; gone stale after a Windows update. That is a handful of lines per injection
; and is never suppressed, because it is exactly what you need to see when the
; mods quietly stop working.
Log=0


; ---------------------------------------------------------------------------
[taskbar-icon-size]
; Taskbar height and icon size. Windows 11 only, x86-64 only.
; Requires offsets\Taskbar.View.dll.sym and friends -- run symgen.exe.
Enabled=1
Targets=explorer.exe

; Pixels at 100% scaling. The mod multiplies by the monitor DPI, so one value is
; correct across displays with different scaling -- on a 150% display a height of
; 48 renders as 72 physical pixels.
;
; These are the Windows 11 defaults. IconSize is applied as a ratio against 24,
; and nothing clamps it against TaskbarHeight, so an icon taller than the bar is
; simply clipped -- raise both together. Setting IconSize to 16 or below also
; switches the mod to requesting Windows' small icon variant rather than
; downscaling the large one.
TaskbarHeight=48
IconSize=24
TaskbarButtonWidth=44
; Used when the taskbar is in its small state (Windows 11 builds from ~July
; 2025). Ignored on older builds.
IconSizeSmall=16
TaskbarButtonWidthSmall=32


; ---------------------------------------------------------------------------
[explorer-context-menu-classic]
; Always show the classic context menu instead of the Windows 11 one.
;
; This mod needs no symbols for its main effect: it works by refusing one
; QueryService call on an exported shcore.dll function. The one symbol it does
; use (CNscTree::ShouldShowMiniMenu in explorerframe.dll) is marked optional
; upstream and only affects the navigation pane tree on the left.
Enabled=1
Targets=explorer.exe

; Hold Ctrl to temporarily get the new Windows 11 menu instead.
overrideWithCtrl=1


; ---------------------------------------------------------------------------
[explorer-details-better-file-sizes]
; Folder sizes and human-readable units in Explorer's details view.
Enabled=1

; Upstream declares this mod as @include * -- it wants to be in every process,
; because any application hosting a shell file dialog shows the details view.
;
; The default here is deliberately narrower than upstream. AllProcesses=0 injects
; only into the processes listed in Targets, which gets you the feature in
; Explorer itself. Set AllProcesses=1 for the full upstream behaviour: the DLL is
; then loaded into essentially every process on the machine, which also requires
; running shellmods.exe elevated so it holds SeDebugPrivilege. That is a large
; increase in blast radius for a formatting change, so it is opt-in.
AllProcesses=0
Targets=explorer.exe

; disabled | everything | always | withShiftKey
;   everything   - ask the "Everything" indexer (instant; needs Everything
;                  running, with Index file size and Index folder size ticked
;                  under Tools > Options > Indexes. The Lite build will not work)
;   always       - calculate by walking the folder (can be slow on big trees)
;   withShiftKey - as above, but only while Shift is held
;
; If you set this to "everything", also add Everything.exe to Targets above.
; Explorer will be asking Everything for folder sizes, so using "Open Path" from
; Everything's own window makes Everything call Explorer, which calls back into
; Everything -- the mod hooks SHOpenFolderAndSelectItems inside Everything.exe to
; move that onto a worker thread and avoid the deadlock.
;
; This is the one setting that needs Explorer restarted. It decides whether the
; mod hooks windows.storage.dll during init, and the mod cannot add those hooks
; later -- the shim says so in shellmods.log rather than pretending it applied.
calculateFolderSizes=disabled

; Sort folders and files together by size rather than folders first.
sortSizesMixFolders=1
; Show MB/GB instead of Explorer's KB-for-everything.
disableKbOnlySizes=1
; Use KiB/MiB/GiB (powers of 1024) instead of KB/MB/GB.
useIecTerms=0
